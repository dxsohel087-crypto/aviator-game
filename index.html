<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Pro - Real Crash Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b111e; color: #ffffff; padding-bottom: 70px; }
        
        header { background: #151d30; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #232d47; }
        .logo { font-size: 18px; font-weight: bold; color: #e51c24; font-style: italic; }
        .user-panel { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .balance-box { background: #0b111e; padding: 5px 10px; border-radius: 5px; border: 1px solid #28a745; color: #28a745; font-weight: bold; }
        
        /* Game Arena */
        .game-container { background: #121926; margin: 10px; border-radius: 10px; padding: 10px; border: 1px solid #232d47; }
        .multiplier-display { text-align: center; font-size: 38px; font-weight: bold; color: #ffca28; margin: 10px 0; text-shadow: 0 0 10px rgba(255,202,40,0.5); }
        #game-canvas { background: #070a12; width: 100%; height: 220px; border-radius: 8px; display: block; }
        
        /* Betting Panels (Dual) */
        .bets-wrapper { display: flex; flex-direction: column; gap: 10px; margin: 10px; }
        .bet-card { background: #151d30; padding: 12px; border-radius: 8px; border: 1px solid #232d47; display: flex; flex-direction: column; gap: 8px; }
        .bet-row { display: flex; justify-content: space-between; align-items: center; }
        .amount-control { display: flex; align-items: center; background: #0b111e; border-radius: 5px; border: 1px solid #232d47; overflow: hidden; }
        .amount-control button { background: #232d47; color: #fff; border: none; padding: 8px 14px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .amount-control button:active { background: #e51c24; }
        .amount-control input { width: 60px; background: transparent; border: none; color: #fff; text-align: center; font-size: 16px; font-weight: bold; outline: none; }
        
        .btn-action { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-bet { background: #28a745; color: #fff; }
        .btn-cashout { background: #ffc107; color: #000; display: none; }
        .btn-cancel { background: #dc3545; color: #fff; display: none; }

        /* Live Players & History */
        .live-stats { display: flex; justify-content: space-between; margin: 10px; background: #151d30; padding: 8px 12px; border-radius: 6px; font-size: 12px; color: #8a99ad; }
        
        /* Navigation Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #151d30; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #232d47; z-index: 100; }
        .nav-item { color: #8a99ad; text-decoration: none; font-size: 12px; text-align: center; cursor: pointer; }
        .nav-item.active { color: #e51c24; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #151d30; padding: 20px; border-radius: 10px; width: 90%; max-width: 350px; border: 1px solid #e51c24; position: relative; }
        .modal-content h3 { margin-bottom: 15px; color: #e51c24; text-align: center; }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 5px; border: 1px solid #232d47; background: #0b111e; color: #fff; }
        .modal-content button { width: 100%; padding: 10px; background: #e51c24; border: none; color: #fff; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">Aviator Pro</div>
        <div class="user-panel" id="header-user-area">
            <!-- Dynamically Loaded -->
        </div>
    </header>

    <!-- Main Game Section -->
    <div id="tab-game">
        <div class="game-container">
            <div class="multiplier-display" id="mult-view">1.00x</div>
            <canvas id="game-canvas" width="360" height="200"></canvas>
        </div>

        <div class="live-stats">
            <span>online: <strong style="color:#28a745">1,429</strong></span>
            <span id="history-mults">History: 1.2x, 2.4x, 1.05x</span>
        </div>

        <!-- Dual Bet Controls -->
        <div class="bets-wrapper">
            <!-- Bet Panel 1 -->
            <div class="bet-card">
                <div class="bet-row">
                    <div class="amount-control">
                        <button onclick="changeBet(1, -50)">-</button>
                        <input type="text" id="bet-input-1" value="100" readonly>
                        <button onclick="changeBet(1, 50)">+</button>
                    </div>
                    <div>
                        <button onclick="setPreset(1, 100)" style="background:#232d47; color:#fff; border:none; padding:5px 8px; border-radius:4px; font-size:11px;">100</button>
                        <button onclick="setPreset(1, 500)" style="background:#232d47; color:#fff; border:none; padding:5px 8px; border-radius:4px; font-size:11px;">500</button>
                    </div>
                </div>
                <button class="btn-action btn-bet" id="btn-bet-1" onclick="toggleBet(1)">বেট করুন (৳100)</button>
                <button class="btn-action btn-cashout" id="btn-cashout-1" onclick="cashOut(1)">Cash Out</button>
            </div>

            <!-- Bet Panel 2 -->
            <div class="bet-card">
                <div class="bet-row">
                    <div class="amount-control">
                        <button onclick="changeBet(2, -50)">-</button>
                        <input type="text" id="bet-input-2" value="200" readonly>
                        <button onclick="changeBet(2, 50)">+</button>
                    </div>
                    <div>
                        <button onclick="setPreset(2, 200)" style="background:#232d47; color:#fff; border:none; padding:5px 8px; border-radius:4px; font-size:11px;">200</button>
                        <button onclick="setPreset(2, 1000)" style="background:#232d47; color:#fff; border:none; padding:5px 8px; border-radius:4px; font-size:11px;">1000</button>
                    </div>
                </div>
                <button class="btn-action btn-bet" id="btn-bet-2" onclick="toggleBet(2)">বেট করুন (৳200)</button>
                <button class="btn-action btn-cashout" id="btn-cashout-2" onclick="cashOut(2)">Cash Out</button>
            </div>
        </div>
    </div>

    <!-- Refer View -->
    <div id="tab-refer" style="display:none; padding: 20px; text-align: center;">
        <h3 style="color: #ffca28; margin-bottom: 10px;">🎁 রেফার করুন ও আয় করুন</h3>
        <p style="color: #8a99ad; font-size: 13px; margin-bottom: 15px;">প্রতিটি সফল রেফারে ইনস্ট্যান্ট পেয়ে যান ৳৫০ বোনাস!</p>
        <input type="text" id="ref-link" value="" readonly style="width: 100%; padding: 10px; text-align: center; background: #151d30; border: 1px solid #232d47; color: #fff; border-radius: 5px; margin-bottom: 10px;">
        <button onclick="copyRef()" style="width: 100%; padding: 10px; background: #28a745; color: #fff; border: none; border-radius: 5px; font-weight: bold;">লিংক কপি করুন</button>
    </div>

    <!-- Profile View -->
    <div id="tab-profile" style="display:none; padding: 20px;">
        <h3 style="color: #e51c24; margin-bottom: 15px;">👤 একাউন্ট প্রোফাইল</h3>
        <div style="background: #151d30; padding: 15px; border-radius: 8px; border: 1px solid #232d47; line-height: 1.8;">
            <p>নাম: <strong id="p-name">-</strong></p>
            <p>নম্বর/আইডি: <strong id="p-phone">-</strong></p>
            <p>ব্যালেন্স: <strong style="color: #28a745;">৳<span id="p-bal">0</span></strong></p>
            <button onclick="logout()" style="margin-top: 15px; width: 100%; padding: 10px; background: #dc3545; color: #fff; border: none; border-radius: 5px; font-weight: bold;">লগ আউট করুন</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('game', this)">🚀 গেম</div>
        <div class="nav-item" onclick="switchTab('refer', this)">🎁 রেফার</div>
        <div class="nav-item" onclick="switchTab('profile', this)">👤 প্রোফাইল</div>
    </div>

    <!-- Auth Modal (Login / Register Combined smoothly) -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h3 id="auth-title">সঠিক তথ্য দিয়ে প্রবেশ করুন</h3>
            <input type="text" id="auth-name" placeholder="আপনার নাম (শুধু নিবন্ধনের জন্য)">
            <input type="text" id="auth-phone" placeholder="মোবাইল নম্বর (যেমন: 017xxxxxxxx)">
            <input type="password" id="auth-pass" placeholder="পাসওয়ার্ড দিন">
            <button onclick="handleAuthSubmit()">লগইন / একাউন্ট তৈরি করুন</button>
        </div>
    </div>

    <script>
        // Database & State Management via LocalStorage
        let currentUser = JSON.parse(localStorage.getItem('aviator_user')) || null;

        function initApp() {
            if (!currentUser) {
                document.getElementById('authModal').style.display = 'flex';
            } else {
                updateHeader();
                document.getElementById('p-name').innerText = currentUser.name;
                document.getElementById('p-phone').innerText = currentUser.phone;
                document.getElementById('p-bal').innerText = currentUser.balance;
                document.getElementById('ref-link').value = `https://dxsohel087-crypto.github.io/aviator-game/?ref=` + currentUser.phone;
            }
        }

        function handleAuthSubmit() {
            let name = document.getElementById('auth-name').value.trim();
            let phone = document.getElementById('auth-phone').value.trim();
            let pass = document.getElementById('auth-pass').value.trim();

            if (!phone || !pass) {
                alert('দয়া করে মোবাইল নম্বর এবং পাসওয়ার্ড দিন।');
                return;
            }

            // Save or Login User permanently
            currentUser = {
                name: name ? name : "খেলোয়াড়",
                phone: phone,
                balance: 1000 // ডেমো বোনাস ১০০০ টাকা স্থায়ীভাবে সেভ থাকবে
            };

            localStorage.setItem('aviator_user', JSON.stringify(currentUser));
            document.getElementById('authModal').style.display = 'none';
            initApp();
        }

        function logout() {
            localStorage.removeItem('aviator_user');
            location.reload();
        }

        function updateHeader() {
            document.getElementById('header-user-area').innerHTML = `
                <div style="font-size:12px;">${currentUser.name}</div>
                <div class="balance-box">৳<span id="top-bal">${currentUser.balance}</span></div>
            `;
        }

        function saveBalance() {
            localStorage.setItem('aviator_user', JSON.stringify(currentUser));
            document.getElementById('top-bal').innerText = currentUser.balance;
            document.getElementById('p-bal').innerText = currentUser.balance;
        }

        function switchTab(tabName, el) {
            document.getElementById('tab-game').style.display = tabName === 'game' ? 'block' : 'none';
            document.getElementById('tab-refer').style.display = tabName === 'refer' ? 'block' : 'none';
            document.getElementById('tab-profile').style.display = tabName === 'profile' ? 'block' : 'none';
            
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function copyRef() {
            let copyText = document.getElementById("ref-link");
            navigator.clipboard.writeText(copyText.value);
            alert("রেফারেল লিংক কপি করা হয়েছে!");
        }

        // Betting Controls logic
        function changeBet(panelId, amt) {
            let input = document.getElementById('bet-input-' + panelId);
            let val = parseInt(input.value) + amt;
            if(val >= 50) input.value = val;
        }
        function setPreset(panelId, val) {
            document.getElementById('bet-input-' + panelId).value = val;
        }

        // Game Engine Logic
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        let gameState = 'IDLE'; // IDLE, RUNNING, CRASHED
        let currentMult = 1.00;
        let crashPoint = 1.00;
        let gameInterval = null;
        let planeX = 10, planeY = 10;

        let betsActive = { 1: false, 2: false };
        let betAmounts = { 1: 0, 2: 0 };

        function drawScene(mult, statusColor = "#ffca28") {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid lines
            ctx.strokeStyle = "#1b263b";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, 150); ctx.lineTo(canvas.width, 150);
            ctx.stroke();

            // Draw Airplane Curve & Icon
            if(gameState === 'RUNNING' || gameState === 'CRASHED') {
                ctx.strokeStyle = "#e51c24";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(10, 180);
                ctx.quadraticCurveTo(planeX / 2, 180 - planeY, planeX, 180 - planeY);
                ctx.stroke();

                // Airplane head marker
                ctx.fillStyle = statusColor;
                ctx.beginPath();
                ctx.arc(planeX, 180 - planeY, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Automatic Game Loop Controller (Continuous Rounds like real Aviator)
        function runGameCycle() {
            gameState = 'RUNNING';
            currentMult = 1.00;
            crashPoint = (Math.random() * 4 + 1.2).toFixed(2); // Random crash
            planeX = 10; planeY = 10;

            // Update UI for active bets
            for(let i=1; i<=2; i++) {
                if(betsActive[i]) {
                    document.getElementById(`btn-bet-${i}`).style.display = 'none';
                    document.getElementById(`btn-cashout-${i}`).style.display = 'block';
                }
            }

            gameInterval = setInterval(() => {
                currentMult += 0.03;
                planeX += 3;
                planeY += 2;
                if(planeX > canvas.width - 30) planeX = canvas.width - 30;
                if(planeY > 140) planeY = 140;

                document.getElementById('mult-view').innerText = currentMult.toFixed(2) + 'x';
                document.getElementById('mult-view').style.color = "#ffca28";
                drawScene(currentMult);

                if(currentMult >= crashPoint) {
                    clearInterval(gameInterval);
                    triggerCrash();
                }
            }, 90);
        }

        function triggerCrash() {
            gameState = 'CRASHED';
            document.getElementById('mult-view').innerText = "CRASHED (" + crashPoint + "x)";
            document.getElementById('mult-view').style.color = "#e51c24";
            drawScene(currentMult, "#e51c24");

            // Auto-fail active bets if not cashed out
            for(let i=1; i<=2; i++) {
                if(betsActive[i]) {
                    betsActive[i] = false;
                    document.getElementById(`btn-cashout-${i}`).style.display = 'none';
                    document.getElementById(`btn-bet-${i}`).style.display = 'block';
                    document.getElementById(`btn-bet-${i}`).innerText = `বেট করুন (৳${betAmounts[i]})`;
                }
            }

            // Wait 4 seconds then restart next round automatically
            setTimeout(() => {
                resetForNextRound();
            }, 3000);
        }

        function resetForNextRound() {
            document.getElementById('mult-view').innerText = "আগামী রাউন্ড শুরু হচ্ছে...";
            setTimeout(runGameCycle, 2000);
        }

        function toggleBet(panelId) {
            let amt = parseInt(document.getElementById(`bet-input-${panelId}`).value);
            if(currentUser.balance < amt) {
                alert('আপনার পর্যাপ্ত ব্যালেন্স নেই!');
                return;
            }

            currentUser.balance -= amt;
            saveBalance();

            betsActive[panelId] = true;
            betAmounts[panelId] = amt;

            let btnBet = document.getElementById(`btn-bet-${panelId}`);
            btnBet.style.background = '#ff9800';
            btnBet.innerText = 'অপেক্ষায় আছে...';
        }

        function cashOut(panelId) {
            if(!betsActive[panelId] || gameState !== 'RUNNING') return;

            let winAmt = Math.floor(betAmounts[panelId] * currentMult);
            currentUser.balance += winAmt;
            saveBalance();

            betsActive[panelId] = false;
            document.getElementById(`btn-cashout-${panelId}`).style.display = 'none';
            let btnBet = document.getElementById(`btn-bet-${panelId}`);
            btnBet.style.display = 'block';
            btnBet.style.background = '#28a745';
            btnBet.innerText = `বেট করুন (৳${betAmounts[panelId]})`;

            alert(`অভিনন্দন! আপনি ৳${winAmt} ক্যাশআউট করেছেন (${currentMult.toFixed(2)}x)।`);
        }

        // Initialize on load & start first round
        window.onload = function() {
            initApp();
            drawScene(1.00);
            setTimeout(runGameCycle, 1500);
        };
    </script>
</body>
    </html>
